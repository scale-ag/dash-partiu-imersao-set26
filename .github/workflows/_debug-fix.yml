name: DEBUG - Validar fix de desambiguacao de conjunto (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replicar a logica NOVA (com desambiguacao por utm_medium)
        run: |
          python3 - <<'PY'
          import csv, io, unicodedata, urllib.request

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read().decode("utf-8-sig", errors="replace")
              return list(csv.reader(io.StringIO(data)))

          def strip_accents(s):
              return "".join(c for c in unicodedata.normalize("NFKD", s) if not unicodedata.combining(c))

          def norm(s):
              return strip_accents((s or "").strip().lower())

          def col_idx(header, *names):
              hn = [norm(h) for h in header]
              for a in names:
                  a = norm(a)
                  for i, h in enumerate(hn):
                      if h == a or (a and a in h):
                          return i
              return None

          META_ID = "1mXaJWC2Eecu7eSwQ8UkamO_sLCIuZCtI5u7tA0YRYFU"
          SALES_ID = "1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI"
          SALES_GID = "1083963375"

          meta_rows = fetch_csv(f"https://docs.google.com/spreadsheets/d/{META_ID}/export?format=csv&gid=0")
          sales_rows = fetch_csv(f"https://docs.google.com/spreadsheets/d/{SALES_ID}/export?format=csv&gid={SALES_GID}")

          mh = meta_rows[0]
          mci, mai, msi = col_idx(mh, "campaign name"), col_idx(mh, "ad name"), col_idx(mh, "ad set name")

          ad_map = {}
          for row in meta_rows[1:]:
              if not any((c or "").strip() for c in row):
                  continue
              camp = (row[mci] or "").strip() or "(sem campanha)"
              ad = (row[mai] or "").strip() or "(sem anuncio)"
              adset = (row[msi] or "").strip() if msi is not None and len(row) > msi else ""
              key = (norm(camp), norm(ad))
              entry = (camp, adset)
              cands = ad_map.setdefault(key, [])
              if entry not in cands:
                  cands.append(entry)

          sh = sales_rows[0]
          sci = col_idx(sh, "utm campaign", "utm_campaign")
          sui = col_idx(sh, "utm content", "utm_content")
          smi = col_idx(sh, "utm medium", "utm_medium")
          svi = [i for i, h in enumerate(sh) if "valor" in norm(h)][0]

          def to_float(v):
              import re
              s = re.sub(r"[^\d,.\-]", "", str(v or "").strip())
              if not s: return 0.0
              if "," in s and "." in s: s = s.replace(".", "").replace(",", ".")
              elif "," in s: s = s.replace(",", ".")
              try: return float(s)
              except ValueError: return 0.0

          by_adset = {}
          disambig_used = 0
          disambig_needed = 0
          for row in sales_rows[1:]:
              if not any((c or "").strip() for c in row):
                  continue
              camp_raw = (row[sci] or "").strip() if sci is not None and len(row) > sci else ""
              ad_raw = (row[sui] or "").strip() if sui is not None and len(row) > sui else ""
              medium_raw = (row[smi] or "").strip() if smi is not None and len(row) > smi else ""
              val_raw = row[svi] if len(row) > svi else ""
              if not camp_raw and not ad_raw:
                  continue
              key = (norm(camp_raw), norm(ad_raw))
              cands = ad_map.get(key)
              if not cands:
                  continue
              if len(cands) > 1:
                  disambig_needed += 1
                  medium_n = norm(medium_raw)
                  match = next((c for c in cands if medium_n and norm(c[1]) == medium_n), None)
                  hit = match or cands[0]
                  if match:
                      disambig_used += 1
              else:
                  hit = cands[0]
              camp, adset = hit
              by_adset.setdefault((camp, adset), {"vendas": 0, "fat": 0.0})
              by_adset[(camp, adset)]["vendas"] += 1
              by_adset[(camp, adset)]["fat"] += to_float(val_raw)

          print(f"Vendas que precisaram desambiguar (anuncio em >1 conjunto na campanha): {disambig_needed}")
          print(f"  ...resolvidas via utm_medium batendo exatamente: {disambig_used}")
          print(f"  ...caidas no fallback (1o conjunto encontrado): {disambig_needed - disambig_used}")
          print("\nDistribuicao final por (campanha, conjunto):")
          for (camp, adset), d in sorted(by_adset.items(), key=lambda kv: -kv[1]["vendas"]):
              print(f"  {d['vendas']:3d} vendas | R$ {d['fat']:8.2f} | conjunto={adset!r} | campanha={camp!r}")
          PY

name: DEBUG - Checar mudanca de conjunto ao longo do tempo (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ver todas as linhas diarias de cada (campanha, anuncio) no Meta
        run: |
          python3 - <<'PY'
          import csv, io, unicodedata, urllib.request

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read().decode("utf-8-sig", errors="replace")
              return list(csv.reader(io.StringIO(data)))

          def strip_accents(s):
              return "".join(c for c in unicodedata.normalize("NFKD", s) if not unicodedata.combining(c))

          def norm(s):
              return strip_accents((s or "").strip().lower())

          def col_idx(header, *names):
              hn = [norm(h) for h in header]
              for a in names:
                  a = norm(a)
                  for i, h in enumerate(hn):
                      if h == a or (a and a in h):
                          return i
              return None

          META_ID = "1mXaJWC2Eecu7eSwQ8UkamO_sLCIuZCtI5u7tA0YRYFU"
          meta_rows = fetch_csv(f"https://docs.google.com/spreadsheets/d/{META_ID}/export?format=csv&gid=0")
          mh = meta_rows[0]
          dci = col_idx(mh, "day", "data")
          mci = col_idx(mh, "campaign name")
          mai = col_idx(mh, "ad name")
          msi = col_idx(mh, "ad set name")
          spi = col_idx(mh, "amount spent")

          rows_by_key = {}
          for row in meta_rows[1:]:
              if not any((c or "").strip() for c in row):
                  continue
              day = (row[dci] or "").strip()
              camp = (row[mci] or "").strip()
              ad = (row[mai] or "").strip()
              adset = (row[msi] or "").strip()
              spent = (row[spi] or "").strip() if spi is not None and len(row) > spi else ""
              key = (norm(camp), norm(ad))
              rows_by_key.setdefault(key, []).append((day, adset, spent))

          print("=== (campanha, anuncio) cujo conjunto (Ad Set Name) MUDOU entre linhas diarias ===")
          any_change = False
          for key, rows in rows_by_key.items():
              adsets = sorted(set(r[1] for r in rows))
              if len(adsets) > 1:
                  any_change = True
                  camp_disp = rows[0]
                  print(f"\n  campanha+anuncio: {key}")
                  for day, adset, spent in sorted(rows):
                      print(f"    dia={day!r:12s} conjunto={adset!r:45s} gasto={spent!r}")
          if not any_change:
              print("  nenhum (todos os pares campanha+anuncio tem o mesmo conjunto em todas as linhas diarias)")

          # E especificamente para AD01 na campanha V1 Sep1:
          print("\n=== TODAS as linhas diarias de AD01 na campanha 'V1 2026-09-01' ===")
          for key, rows in rows_by_key.items():
              c, a = key
              if "ad01" in a and "2026-09-01" in c:
                  for day, adset, spent in sorted(rows):
                      print(f"  dia={day!r:12s} conjunto={adset!r:45s} gasto={spent!r}")
          PY

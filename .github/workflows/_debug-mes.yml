name: DEBUG - Vendas do mes por aba (temporário)

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a apurar (YYYY-MM)"
        required: true
        default: "2026-09"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apurar vendas e faturamento do mes, por aba
        env:
          MES: ${{ inputs.mes }}
        run: |
          python3 - <<'PY'
          import csv, io, os, re, unicodedata, urllib.parse, urllib.request
          from datetime import datetime

          MES = os.environ["MES"]
          SALES_ID = "1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read().decode("utf-8-sig", errors="replace")

          def norm(s):
              s = unicodedata.normalize("NFKD", (s or "").strip().lower())
              return "".join(c for c in s if not unicodedata.combining(c))

          def parse_date(v):
              if not v: return None
              s = str(v).strip()
              if not s: return None
              m = re.match(r"(\d{4})-(\d{2})-(\d{2})", s)
              if m: return f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
              dp = s.split(" ")[0].split("T")[0]
              for cand in ((s, dp) if dp != s else (s,)):
                  for fmt in ("%d/%m/%Y","%m/%d/%Y","%d/%m/%y","%b %d, %Y","%Y/%m/%d"):
                      try: return datetime.strptime(cand, fmt).strftime("%Y-%m-%d")
                      except ValueError: continue
              return None

          def to_float(v):
              s = re.sub(r"[^\d,.\-]", "", str(v or "").strip())
              if not s: return 0.0
              if "," in s and "." in s: s = s.replace(".","").replace(",",".")
              elif "," in s: s = s.replace(",",".")
              try: return float(s)
              except ValueError: return 0.0

          # 1) descobrir as abas pelo HTML da planilha
          html = get(f"https://docs.google.com/spreadsheets/d/{SALES_ID}/edit")
          abas = re.findall(r'docs-sheet-tab-caption">([^<]+)</div>', html)
          seen, tabs = set(), []
          for a in abas:
              if a not in seen:
                  seen.add(a); tabs.append(a)
          print("=== ABAS ENCONTRADAS NA PLANILHA ===")
          for t in tabs: print(f"  - {t!r}")

          # 2) apurar cada aba
          for tab in tabs:
              print("\n" + "="*78)
              print(f"ABA: {tab!r}   (mes {MES})")
              print("="*78)
              url = (f"https://docs.google.com/spreadsheets/d/{SALES_ID}/gviz/tq"
                     f"?tqx=out:csv&sheet={urllib.parse.quote(tab)}")
              try:
                  rows = list(csv.reader(io.StringIO(get(url))))
              except Exception as e:
                  print(f"  ERRO ao ler a aba: {e}"); continue
              if not rows:
                  print("  aba vazia"); continue
              header = rows[0]
              print(f"  colunas: {[h for h in header if h.strip()]}")
              print(f"  linhas totais na aba: {len(rows)-1}")

              hn = [norm(h) for h in header]
              # coluna de data: 'data' exata primeiro; senao a primeira que contenha 'data'
              di = next((i for i,h in enumerate(hn) if h == "data"), None)
              if di is None:
                  di = next((i for i,h in enumerate(hn) if "data" in h), None)
              # coluna de valor
              vi = next((i for i,h in enumerate(hn)
                         if "valor" in h or "faturamento" in h or "preco" in h), None)
              utm_idx = [i for i,h in enumerate(hn) if h.startswith("utm")]
              print(f"  -> coluna de data  : {header[di]!r}" if di is not None else "  -> SEM coluna de data")
              print(f"  -> coluna de valor : {header[vi]!r}" if vi is not None else "  -> SEM coluna de valor")
              print(f"  -> colunas UTM     : {[header[i] for i in utm_idx]}")
              if di is None or vi is None:
                  print("  (nao da pra apurar sem data e/ou valor)"); continue

              tot_n = tot_v = 0; tot_val = 0.0
              full_n = 0; full_val = 0.0
              part_n = 0; part_val = 0.0
              none_n = 0; none_val = 0.0
              faltando = {}
              for row in rows[1:]:
                  if not any((c or "").strip() for c in row): continue
                  d = parse_date(row[di] if len(row) > di else "")
                  if not d or not d.startswith(MES): continue
                  tot_n += 1
                  val = to_float(row[vi] if len(row) > vi else "")
                  tot_val += val
                  preenchidas = [i for i in utm_idx if len(row) > i and (row[i] or "").strip()]
                  if utm_idx and len(preenchidas) == len(utm_idx):
                      full_n += 1; full_val += val
                  elif preenchidas:
                      part_n += 1; part_val += val
                      for i in utm_idx:
                          if i not in preenchidas:
                              faltando[header[i]] = faltando.get(header[i], 0) + 1
                  else:
                      none_n += 1; none_val += val

              print(f"\n  --- {MES} ---")
              print(f"  TODAS as vendas do mes      : {tot_n:3d}  R$ {tot_val:10.2f}")
              print(f"  COM UTM COMPLETA            : {full_n:3d}  R$ {full_val:10.2f}   <<<")
              print(f"  com UTM parcial             : {part_n:3d}  R$ {part_val:10.2f}")
              print(f"  sem nenhuma UTM             : {none_n:3d}  R$ {none_val:10.2f}")
              if full_n:
                  print(f"  ticket medio (UTM completa) : R$ {full_val/full_n:.2f}")
              if faltando:
                  print(f"  nas parciais, faltou: {faltando}")
          PY

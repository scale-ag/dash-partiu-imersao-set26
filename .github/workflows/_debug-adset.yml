name: DEBUG - Detalhar vendas por anuncio/conjunto (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detalhar cada venda cruzada, por anuncio e conjunto real
        run: |
          python3 - <<'PY'
          import csv, io, re, unicodedata, urllib.request

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read().decode("utf-8-sig", errors="replace")
              return list(csv.reader(io.StringIO(data)))

          def strip_accents(s):
              return "".join(c for c in unicodedata.normalize("NFKD", s) if not unicodedata.combining(c))

          def norm(s):
              return strip_accents((s or "").strip().lower())

          def col_idx(header, *names):
              hn = [norm(h) for h in header]
              for a in names:
                  a = norm(a)
                  for i, h in enumerate(hn):
                      if h == a or (a and a in h):
                          return i
              return None

          META_ID = "1mXaJWC2Eecu7eSwQ8UkamO_sLCIuZCtI5u7tA0YRYFU"
          SALES_ID = "1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI"
          SALES_GID = "1083963375"

          meta_rows = fetch_csv(f"https://docs.google.com/spreadsheets/d/{META_ID}/export?format=csv&gid=0")
          sales_rows = fetch_csv(f"https://docs.google.com/spreadsheets/d/{SALES_ID}/export?format=csv&gid={SALES_GID}")

          mh = meta_rows[0]
          mci, mai, msi = col_idx(mh, "campaign name"), col_idx(mh, "ad name"), col_idx(mh, "ad set name")

          ad_map = {}
          for row in meta_rows[1:]:
              if not any((c or "").strip() for c in row):
                  continue
              camp = (row[mci] or "").strip() or "(sem campanha)"
              ad = (row[mai] or "").strip() or "(sem anuncio)"
              adset = (row[msi] or "").strip() if msi is not None and len(row) > msi else ""
              ad_map[(norm(camp), norm(ad))] = (camp, ad, adset)

          # todos os (campanha,anuncio,conjunto) reais que TEM gasto, mesmo sem venda
          print("=== Todas as combinacoes reais no Meta (campanha | conjunto | anuncio) ===")
          for (c, a), (co, ao, adsetreal) in ad_map.items():
              print(f"  {co} | {adsetreal} | {ao}")

          sh = sales_rows[0]
          sci = col_idx(sh, "utm campaign", "utm_campaign")
          sui = col_idx(sh, "utm content", "utm_content")
          svi = [i for i, h in enumerate(sh) if "valor" in norm(h)][0]

          print("\n=== Cada venda cruzada: qual anuncio/conjunto REAL ela caiu ===")
          count_by_ad = {}
          for row in sales_rows[1:]:
              if not any((c or "").strip() for c in row):
                  continue
              camp_raw = (row[sci] or "").strip() if sci is not None and len(row) > sci else ""
              ad_raw = (row[sui] or "").strip() if sui is not None and len(row) > sui else ""
              if not camp_raw and not ad_raw:
                  continue
              key = (norm(camp_raw), norm(ad_raw))
              hit = ad_map.get(key)
              if hit:
                  co, ao, adsetreal = hit
                  count_by_ad[(co, adsetreal, ao)] = count_by_ad.get((co, adsetreal, ao), 0) + 1

          for (co, adsetreal, ao), n in sorted(count_by_ad.items(), key=lambda kv: -kv[1]):
              print(f"  {n:3d} vendas | conjunto={adsetreal!r} | anuncio={ao!r} | campanha={co!r}")

          print("\n=== Anuncios com GASTO no Meta mas SEM nenhuma venda cruzada ===")
          ads_with_sales = {ao for (_, _, ao) in count_by_ad}
          for (c, a), (co, ao, adsetreal) in ad_map.items():
              if ao not in ads_with_sales:
                  print(f"  campanha={co!r} conjunto={adsetreal!r} anuncio={ao!r}")
          PY

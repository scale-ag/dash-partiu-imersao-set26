name: DEBUG - Inspecionar planilhas (temporário)

# Workflow TEMPORÁRIO usado só durante a configuração inicial do cliente,
# para descobrir os nomes reais das colunas das duas planilhas e cruzar as
# colunas UTM com o Ad Name do Meta. Roda no runner do Actions porque o
# sandbox do agente não alcança docs.google.com. Removido antes do deploy
# final — não faz parte da engine do dashboard.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar e inspecionar planilhas
        run: |
          python3 - <<'PY'
          import csv, io, urllib.request, urllib.parse

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read().decode("utf-8-sig", errors="replace")
              return list(csv.reader(io.StringIO(data)))

          def col_idx(header, *names):
              norm = lambda s: s.strip().lower()
              names_n = [norm(n) for n in names]
              for i, h in enumerate(header):
                  if norm(h) in names_n:
                      return i
              return None

          META_ID = "1mXaJWC2Eecu7eSwQ8UkamO_sLCIuZCtI5u7tA0YRYFU"
          SALES_ID = "1Qe1_LFcrd98hhOTa5rJAL78ZRUoHCZ-Pj4kIRgdiljI"
          SALES_SHEET_NAME = "Imersao 0 ao Lucro 4"

          meta_url = f"https://docs.google.com/spreadsheets/d/{META_ID}/export?format=csv&gid=0"
          sales_url = f"https://docs.google.com/spreadsheets/d/{SALES_ID}/gviz/tq?tqx=out:csv&sheet={urllib.parse.quote(SALES_SHEET_NAME)}"

          print("=== META ADS (gid=0) ===")
          meta_rows = fetch_csv(meta_url)
          meta_header = meta_rows[0]
          print(f"linhas: {len(meta_rows)-1}")
          print("colunas:", meta_header)

          camps = set()
          ad_names = set()
          ci = col_idx(meta_header, "Campaign Name")
          if ci is not None:
              camps = set(r[ci].strip() for r in meta_rows[1:] if len(r) > ci and r[ci].strip())
              print()
              print(f"Campaign Name unicos no Meta Ads ({len(camps)}):")
              for c in sorted(camps):
                  print(" -", c)
          ai = col_idx(meta_header, "Ad Name")
          if ai is not None:
              ad_names = set(r[ai].strip() for r in meta_rows[1:] if len(r) > ai and r[ai].strip())
              print()
              print(f"Ad Name unicos no Meta Ads ({len(ad_names)}):", sorted(ad_names))

          print()
          print(f"=== COMPRADORES (aba '{SALES_SHEET_NAME}') ===")
          try:
              sales_rows = fetch_csv(sales_url)
              sales_header = sales_rows[0]
              print(f"linhas: {len(sales_rows)-1}")
              print("colunas:", sales_header)
          except Exception as e:
              print("ERRO ao buscar a aba por nome:", e)
              sales_rows = None
              sales_header = []

          if sales_rows:
              pi = col_idx(sales_header, "PRODUTO", "Produto")
              if pi is not None:
                  prods = sorted(set(r[pi].strip() for r in sales_rows[1:] if len(r) > pi and r[pi].strip()))
                  print()
                  print("PRODUTO unicos:", prods)

              utm_cols = [h for h in sales_header if h.lower().startswith("utm_")]
              print()
              print("Colunas UTM encontradas:", utm_cols)
              for uc in utm_cols:
                  ui = col_idx(sales_header, uc)
                  vals = [r[ui].strip() for r in sales_rows[1:] if len(r) > ui and r[ui].strip()]
                  match_ad = sum(1 for v in vals if v in ad_names)
                  match_camp = sum(1 for v in vals if v in camps)
                  print(f"  {uc}: preenchidas={len(vals)} match_Ad_Name={match_ad} match_Campaign_Name={match_camp} sample={vals[:8]}")

              print()
              print("Todas as colunas da BASE de compradores:")
              for i, h in enumerate(sales_header):
                  print(f"  [{i}] {h}")
          PY
